function affordResult(d) {
  const a = parseCents(d.amount), s = summary(curMonth());
  if (!a.cents) return { html: `<div class="muted small">Enter an amount to see how it fits this month. You have <b>${money(Math.max(s.Q, 0))}</b> free to spend${s.U ? ' after upcoming recurring payments' : ''}.</div>`, ok: false, error: a.error };
  const x = a.cents, cat = d.categoryId ? S.categories[d.categoryId] : null;
  const st = cat ? catState(cat, curMonth()) : null;
  const freeAfter = s.Q - x, leftAfter = s.A - x;
  const daysLeft = s.daysLeft, perDayAfter = Math.floor(Math.max(freeAfter, 0) / daysLeft);
  const catAfter = st && st.hasBudget ? st.available - x : null;
  let verdict, kind;
  if (leftAfter < 0) { kind = 'bad'; verdict = `This would put you ${money(-leftAfter)} over your ${whole(s.spendable)} spending allowance.`; }
  else if (freeAfter < 0) { kind = 'warn'; verdict = `It fits what's left, but leaves ${money(-freeAfter)} too little for your upcoming recurring payments.`; }
  else if (catAfter != null && catAfter < 0) { kind = 'warn'; verdict = `It fits your month, but puts ${esc(cat.name)} ${money(-catAfter)} over its limit.`; }
  else { kind = 'good'; verdict = 'Yes, this fits your plan.'; }
  const rows = [
    ['Free to spend', s.Q, freeAfter],
    ['Left this month', s.A, leftAfter],
    catAfter != null ? [`${cat.name} left`, st.available, catAfter] : null
  ].filter(Boolean).map(([l, b, af]) => `<div class="kv"><span>${esc(l)}</span><span class="num">${money(b)} → <b class="${af < 0 ? 'neg' : ''}">${af < 0 ? '−' : ''}${money(Math.abs(af))}</b></span></div>`).join('');
  return { ok: true, html: `<div class="verdict s-${kind}">${icon(STATUS_ICON[kind])}<span>${verdict}</span></div>${rows}
    <div class="muted small">${freeAfter > 0 ? `Afterward, about ${floorWhole(perDayAfter)} a day for the ${daysLeft} ${daysLeft === 1 ? 'day' : 'days'} left (now ${floorWhole(s.perDay)}).` : 'Afterward, nothing would be left to spend this month.'}</div>` };
}

function recurringDraft(r) {

function goalPreview(sh, d) {
  const errs = {}, g = sh.id ? S.goals[sh.id] : null, cur = curMonth();
  const t = parseCents(d.target), st0 = d.start ? parseCents(d.start) : { cents: 0 }, m0 = d.monthly ? parseCents(d.monthly) : { cents: 0 };
  if (d.target && t.error) errs.target = t.error;
  if (d.start && st0.error) errs.start = st0.error;
  if (d.monthly && m0.error) errs.monthly = m0.error;
  if (d.hasDate && d.targetDate && (!isDate(d.targetDate) || monthOf(d.targetDate) < cur)) errs.date = 'Choose a date this month or later.';
  const dr = $('#gdate-row'); if (dr) dr.hidden = !d.hasDate;
  const target = t.cents || 0, start = st0.cents || 0, monthly = m0.cents || 0;
  let before = start; // what will have been set aside before this month, using the numbers being edited
  if (g) for (const m of monthRange(g.startMonth, prevMonth(cur))) before += Math.max(0, Math.min(goalPlanned(planFor(m), g), target - before));
  let html = '';
  if (target && !errs.start) {
    const left = Math.max(0, target - before);
    if (!left) html = 'This goal is already fully set aside.';
    else if (d.hasDate && isDate(d.targetDate) && !errs.date) {
      const months = monthRange(cur, monthOf(d.targetDate)).length;
      const need = Math.ceil(left / months / 100) * 100;
      html = `To reach ${money(target)} by ${esc(shortDate(d.targetDate))}, set aside ${money(need)} a month for ${months} ${months === 1 ? 'month' : 'months'}.
        ${need !== monthly ? `<button class="pill" data-act="use-suggest" data-v="${editable(need)}">Use ${whole(need)} a month</button>` : ''}`;
    } else if (monthly) html = `At ${money(monthly)} a month, you'll have it in about ${Math.ceil(left / monthly)} ${Math.ceil(left / monthly) === 1 ? 'month' : 'months'}.`;
    if (monthly) html += ` <span class="muted">This lowers Free to spend by ${money(Math.min(monthly, left))} this month.</span>`;
  }
  const ok = !Object.keys(errs).length && d.name.trim() !== '' && target > 0 && (!d.hasDate || isDate(d.targetDate)) && start < target + 1;
  return { errs, html, ok, target, start, monthly };
}

// ---------- Validation for whichever sheet is open ----------
function setErr(id, msg) { const el = document.getElementById(id); if (el) el.textContent = msg || ''; }
function validateSheet() {
  const sh = ui.sheet; if (!sh) return;
  const btn = $('#sheet-save'), d = sh.draft;
  let ok = true;
  if (sh.kind === 'entry') {
    const { errs } = entryErrors(d);
    setErr('err-amount', d.amount ? errs.amount : '');
    setErr('err-date', errs.date);
    const ss = $('#split-status'); if (ss) { ss.textContent = errs.split || 'Splits add up to the total.'; ss.className = 'sec-foot num' + (errs.split && d.amount ? ' s-warn' : ''); }
    ok = !Object.keys(errs).length;
    const gn = $('#goal-note');
    if (gn) gn.textContent = d.goalId && S.goals[d.goalId] ? `Comes out of the money set aside for ${S.goals[d.goalId].name}, so it won't count against this month's budget.` : '';
    const rn = $('#repeat-note');
    if (rn) rn.textContent = d.repeat === 'none' ? 'Choose a schedule for subscriptions and bills that repeat.'
      : `Tally will add this ${({ weekly: 'every week', biweekly: 'every 2 weeks', monthly: `on the ${ordinal(nums(isDate(d.date) ? d.date : today())[2])} of each month`, yearly: 'every year' })[d.repeat]} starting after ${isDate(d.date) ? shortDate(d.date) : 'this date'}. Manage it on the Plan tab.`;
  } else if (sh.kind === 'afford') {
    const res = affordResult(d);
    $('#afford-result').innerHTML = res.html;
    setErr('err-amount', d.amount ? res.error : '');
    $('#afford-add').disabled = !res.ok;
  } else if (sh.kind === 'catplan' || sh.kind === 'catedit') {
    const lr = $('#limit-row'); if (lr) lr.hidden = !d.hasLimit;
    let err = '';
    if (d.hasLimit) { const p = parseCents(d.limit); err = p.empty ? 'Enter a limit, or turn the limit off.' : (p.error || ''); }
    setErr('err-limit', d.hasLimit && d.limit ? err : '');
    ok = !err && (sh.kind !== 'catedit' || d.name.trim() !== '');
  } else if (sh.kind === 'move') {
    const res = movePreview(sh, d);
    $('#move-preview').innerHTML = res.html;
    setErr('err-amount', d.amount ? res.error : '');
    ok = res.ok;
  } else if (sh.kind === 'total') {
    const p = parseCents(d.amount);
    setErr('err-amount', d.amount ? p.error : '');
    ok = !!p.cents;
  } else if (sh.kind === 'goal') {
    const res = goalPreview(sh, d);
    for (const k of ['target', 'start', 'monthly', 'date']) setErr('err-g' + k, res.errs[k]);
    $('#goal-suggest').innerHTML = res.html;
    ok = res.ok;
  } else if (sh.kind === 'recurring') {
    $('#day2-row').hidden = d.cadence !== 'twicemonthly';
    $('#end-row').hidden = !d.hasEnd;
    const { errs, preview } = recurringPreview(sh, d);
    setErr('err-amount', d.amount ? errs.amount : '');
    setErr('err-dates', errs.dates);
    $('#rec-preview').textContent = preview;
    ok = !errs.amount && !errs.dates && !!parseCents(d.amount).cents && d.name.trim() !== '' && !!d.categoryId;
  }
  if (btn) btn.disabled = !ok;
}

// ---------- Saving sheets ----------
function saveSheet() {
  const sh = ui.sheet; if (!sh) return;
  const btn = $('#sheet-save'); if (!btn || btn.disabled) return;
  const d = sh.draft;
  if (sh.kind === 'entry') {
    const { errs, cents } = entryErrors(d);
    if (Object.keys(errs).length) return;
    const parts = d.split ? d.parts.map(p => ({ categoryId: p.categoryId, amount: parseCents(p.amount).cents })) : [{ categoryId: d.categoryId, amount: cents }];
    const base = sh.item;
    let id = base ? base.id : uid(), recurringId = base ? base.recurringId : null;
    if (!base && d.type === 'expense' && !d.split && d.repeat !== 'none') {
      const r = { id: uid(), name: d.note.trim() || catFor(d.categoryId).name, amount: cents, categoryId: d.categoryId, cadence: d.repeat, anchor: d.date,
        day: nums(d.date)[2], day2: null, endDate: null, paused: false, skipped: [], postedThrough: d.date };
      put('recurring', r);
      recurringId = r.id; id = occurrenceId(r, d.date);
    }
    put('entries', { id, type: d.type, date: d.date, amount: cents, parts, note: d.note.trim(), recurringId, goalId: d.goalId || null, ts: base ? base.ts : Date.now() });
    if (d.date < S.settings.trackingStart) put('meta', Object.assign({}, S.settings, { trackingStart: d.date }));
    toast(base ? 'Saved.' : (d.type === 'refund' ? 'Refund added.' : `Added ${money(cents)}.`));
  } else if (sh.kind === 'catplan') {
    const c = S.categories[sh.id], M = sh.month, st = catState(c, M);
    const newLimit = d.hasLimit ? parseCents(d.limit).cents : null;
    if (newLimit !== st.limit) editPlan(M, p => { p.limits[c.id] = newLimit; });
    if (d.rollover !== !!c.rollover) {
      put('categories', Object.assign({}, c, { rollover: d.rollover, rolloverFrom: d.rollover ? M : null }));
    }
  } else if (sh.kind === 'catedit') {
    if (sh.id) put('categories', Object.assign({}, S.categories[sh.id], { name: d.name.trim(), color: d.color, icon: d.icon }));
    else {
      const id = uid(), limit = d.hasLimit ? parseCents(d.limit).cents : null;
      const order = Math.max(-1, ...catList().map(c => c.order)) + 1;
      put('categories', { id, name: d.name.trim(), color: d.color, icon: d.icon, order, archived: false, rollover: false, rolloverFrom: null, limit, createdMonth: curMonth() });
      if (limit != null) editPlan(curMonth(), p => { p.limits[id] = limit; });
    }
  } else if (sh.kind === 'move') {
    const res = movePreview(sh, d); if (!res.ok) return;
    const cents = parseCents(d.amount).cents;
    editPlan(sh.month, p => {
      p.limits[d.from] = (p.limits[d.from] || 0) - cents;
      p.limits[d.to] = (p.limits[d.to] || 0) + cents;
      p.moves = (p.moves || []).concat([{ from: d.from, to: d.to, amount: cents, note: d.note.trim(), at: Date.now() }]);
    });
    toast(`Moved ${money(cents)} to ${catFor(d.to).name}.`);
  } else if (sh.kind === 'total') {
    const cents = parseCents(d.amount).cents;
    editPlan(sh.month, p => { p.total = cents; });
    if (sh.month >= curMonth() && !Object.keys(S.plans).some(k => k > sh.month)) put('meta', Object.assign({}, S.settings, { defaultBudget: cents }));
  } else if (sh.kind === 'recurring') {
    const base = sh.id ? S.recurring[sh.id] : null;
    const r = draftToRecurring(d, base);
    if (base && base.paused && !r.paused) r.postedThrough = addDays(today(), -1); // don't backfill the paused stretch
    put('recurring', r);
  } else if (sh.kind === 'goal') {
    const res = goalPreview(sh, d); if (!res.ok) return;
    const cur = curMonth(), base = sh.id ? S.goals[sh.id] : null;
    const fields = { name: d.name.trim(), target: res.target, targetDate: d.hasDate ? d.targetDate : null, startAmount: res.start, monthly: res.monthly };
    if (base) {
      if (res.monthly !== goalPlanned(planFor(cur), base)) editPlan(cur, p => { p.goals[base.id] = res.monthly; });
      put('goals', Object.assign({}, base, fields));
    } else {
      const order = Math.max(-1, ...goalList().map(g => g.order)) + 1;
      put('goals', Object.assign({ id: uid(), startMonth: cur, color: PALETTE[(order + 5) % PALETTE.length][0], archivedMonth: null, order }, fields));
    }
    toast(base ? 'Goal saved.' : `Goal added. ${money(res.monthly)} a month is set aside from your allowance.`);
  } else if (sh.kind === 'restore') {
    applyRestore(sh.state);
  }
  postDueRecurring();
  closeSheet();
  render();
}

async function offerFile(name, text, type) {
  try {
    const file = new File([text], name, { type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return true; }
  } catch (e) { if (e && e.name === 'AbortError') return false; }
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  return true;
}
async function exportBackup() {
  const payload = { app: 'Tally', format: 'tally-backup', schema: SCHEMA, appVersion: APP_VERSION, exportedAt: new Date().toISOString(),
    counts: { entries: Object.keys(S.entries).length, categories: Object.keys(S.categories).length, recurring: Object.keys(S.recurring).length, plans: Object.keys(S.plans).length },
    data: S };
  const ok = await offerFile(`tally-backup-${today()}.json`, JSON.stringify(payload, null, 1), 'application/json');
  if (ok) { meta.lastBackupAt = Date.now(); meta.changesSinceBackup = 0; saveMeta(); toast('Backup saved.'); render(); }
}
function csvCell(v) {
  let s = String(v == null ? '' : v);
  if (/^[=+\-@\t\r]/.test(s) && !/^-?\d+(\.\d+)?$/.test(s)) s = "'" + s; // stop spreadsheet formulas, keep negative numbers
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function downloadFile(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
async function shareFile(name, text, type) {
  try { await navigator.share({ files: [new File([text], name, { type })], title: name }); return true; }
  catch (e) { if (!(e && e.name === 'AbortError')) toast("Couldn't open the share menu."); return false; }
}
const slug = t => String(t).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
async function exportCSV(mode, scope) {
  let list = allEntries(), name = `tally-spending-${today()}.csv`;
  if (scope === 'view') {
    const f = ui.filters, period = f.period === 'current' ? curMonth() : f.period === 'last' ? prevMonth(curMonth()) : f.period;
    list = filteredEntries();
    name = `tally-${period === 'all' ? 'all-time' : period}${f.cat !== 'all' ? '-' + slug(catFor(f.cat).name) : ''}${f.q ? '-search' : ''}.csv`;
  }
  const text = '\ufeff' + csvFor(list);
  if (mode === 'share') { if (await shareFile(name, text, 'text/csv')) toast('Shared.'); return; }
  if (IOS_APP && CAN_SHARE_FILES) { await shareFile(name, text, 'text/csv'); return; } // iPhone Home Screen apps save files through this menu
  downloadFile(name, text, 'text/csv');
  toast(`Downloaded ${name}. Refunds are negative amounts.`);
}
function csvFor(list) {
  const rows = [['Date', 'Type', 'Amount', 'Category', 'Note', 'Split', 'Recurring', 'Paid from', 'Entry ID']];
  for (const e of list.slice().reverse()) {
    for (const p of e.parts) {
      rows.push([e.date, e.type === 'refund' ? 'Refund' : 'Expense', ((e.type === 'refund' ? -1 : 1) * p.amount / 100).toFixed(2),
        catFor(p.categoryId).name, e.note, e.parts.length > 1 ? `${e.parts.length}-way split of ${(e.amount / 100).toFixed(2)}` : '',
        e.recurringId && S.recurring[e.recurringId] ? S.recurring[e.recurringId].name : (e.recurringId ? 'Yes' : ''),
        e.goalId ? (S.goals[e.goalId] ? `${S.goals[e.goalId].name} (goal)` : 'Savings goal') : 'Monthly budget', e.id]);
    }
  }
  return rows.map(r => r.map(csvCell).join(',')).join('\r\n');
}
function readBackup(file) {

  const reader = new FileReader();

    let raw;
    try { raw = JSON.parse(reader.result); } catch (e) { return toast("That file isn't a Tally backup."); }
    let st, dropped = {}, fromV1 = false, exportedAt = null;
    if (raw && raw.format === 'tally-backup' && raw.data) {
      if (Number(raw.schema) > SCHEMA) return toast('That backup came from a newer version of Tally. Update the app first.');
      const n = normalizeState(raw.data); st = n.state; dropped = n.dropped; exportedAt = raw.exportedAt;
    } else if (raw && Array.isArray(raw.expenses) && Array.isArray(raw.categories)) {
      st = migrateV1(raw); fromV1 = true;
    } else return toast("That file isn't a Tally backup.");
    openSheet({ kind: 'restore', state: st, dropped, fromV1, exportedAt, draft: {} });
  };

}
function applyRestore(st) {

  toast('Backup restored.', { label: 'Undo', run: () => { replaceState(normalizeState(JSON.parse(before)).state); toast('Restore undone.'); render(); } });

// Swaps in a whole new dataset, here and in the cloud.
function replaceState(st) {
  const old = S;
  S = st; calcVersion++; persist();
  meta.changesSinceBackup++; saveMeta();
  if (cloudLinked()) {
    const sets = [], dels = [];
    for (const col of COLS) {
      const nowMap = col === 'meta' ? { settings: S.settings } : S[col];
      const oldMap = col === 'meta' ? { settings: old.settings } : old[col];
      for (const [k, v] of Object.entries(nowMap)) sets.push({ col, id: k, data: v });
      for (const k of Object.keys(oldMap)) if (!has(nowMap, k)) dels.push({ col, id: k });
    }
    sync.cloud.writeMany(sync.user.uid, sets, dels).catch(syncFailed);

function friendlyError(e) {
  const code = (e && (e.code || e.message)) || '';
  if (/invalid-credential|wrong-password|user-not-found|invalid-login/.test(code)) return 'Email or password is incorrect.';
  if (/email-already-in-use/.test(code)) return 'There is already an account with this email. Sign in instead.';
  if (/weak-password/.test(code)) return 'Use a password with at least 6 characters.';
  if (/invalid-email/.test(code)) return "That email address doesn't look right.";
  if (/missing-password/.test(code)) return 'Enter your password.';
  if (/network-request-failed|unavailable/.test(code)) return "No connection. Try again when you're online.";
  if (/too-many-requests/.test(code)) return 'Too many attempts. Wait a few minutes and try again.';
  if (/operation-not-allowed|configuration-not-found/.test(code)) return 'Email sign-in is not turned on in Firebase yet (Authentication → Sign-in method).';
  if (/permission-denied/.test(code)) return 'Sync was blocked. Check the Firestore rules in Firebase.';
  if (/resource-exhausted|quota/.test(code)) return "Firebase's free daily limit was reached. Sync resumes tomorrow; your changes are kept on this device.";
  return 'Something went wrong with sync. Your changes are kept on this device.';
}
function syncFailed(e) { sync.status = 'error'; sync.error = friendlyError(e); scheduleRender(); }

async function startSync() {
  const config = FIREBASE_CONFIG || window.__TALLY_TEST_CONFIG__;
  if (!config) return;
  try {
    const factory = window.__TALLY_TEST_CLOUD__ || (await import('./cloud.js')).createCloud;
    sync.cloud = factory(config, window.__TALLY_CLOUD_OPTIONS__ || {});
  } catch (e) {
    sync.loadError = "Sync couldn't load. Open Tally once while online to finish setting it up.";
    render(); return;
  }
  sync.status = 'signedout';

}
async function onAuthChange(user) {
  if (sync.stop) { sync.stop(); sync.stop = null; }
  sync.user = user; sync.loaded = new Set(); sync.pending = {}; sync.error = '';
  canGenerate = true;
  if (!user) { sync.status = 'signedout'; if (meta.syncUid) { meta.syncUid = null; saveMeta(); } render(); return; }
  sync.status = 'connecting'; render();
  if (meta.syncUid === user.uid) { beginListening(); return; }
  // First sign-in on this device for this account: decide how local and account data come together.
  let cloudData;
  try { cloudData = await sync.cloud.fetchAll(user.uid); } catch (e) {
    sync.status = 'error'; sync.error = /unavailable|network|offline/i.test((e && (e.code || e.message)) || '') ? 'Connect to the internet to finish turning on sync.' : friendlyError(e);
    render(); return;
  }
  const cloudEmpty = !Object.keys(cloudData.entries || {}).length && !Object.keys(cloudData.categories || {}).length;
  const localHasData = Object.keys(S.entries).length > 0 || Object.keys(S.recurring).length > 0;
  if (cloudEmpty) { await linkAndUpload(user); }
  else if (!localHasData) { adoptCloud(cloudData); finishLink(user); }

}
function stateFromCloud(c) {

}
function adoptCloud(cloudData) {

const newer = (a, b) => (!b ? a : !a ? b : ((a.updatedAt || 0) >= (b.updatedAt || 0) ? a : b));

  const remap = {}; for (const c of Object.values(L.categories)) { const hit = byName[c.name.trim().toLowerCase()]; if (hit && hit !== c.id) remap[c.id] = hit; }
  const rc = id => remap[id] || id;

    goals: Object.assign({}, C.goals), recurring: Object.assign({}, C.recurring), entries: Object.assign({}, C.entries) };
  for (const g of Object.values(L.goals || {})) out.goals[g.id] = newer(g, C.goals[g.id]);
  out.settings = Object.assign({}, out.settings, { trackingStart: [L.settings.trackingStart, C.settings.trackingStart].sort()[0] });
  for (const c of Object.values(L.categories)) if (!remap[c.id]) out.categories[c.id] = newer(c, C.categories[c.id]);
  for (const e of Object.values(L.entries)) out.entries[e.id] = newer(Object.assign({}, e, { parts: e.parts.map(p => ({ categoryId: rc(p.categoryId), amount: p.amount })) }), C.entries[e.id]);
  for (const r of Object.values(L.recurring)) out.recurring[r.id] = newer(Object.assign({}, r, { categoryId: rc(r.categoryId) }), C.recurring[r.id]);
  for (const [m, p] of Object.entries(L.plans)) {
    const limits = {}; for (const [k, v] of Object.entries(p.limits || {})) limits[rc(k)] = v;
    out.plans[m] = newer(Object.assign({}, p, { limits }), C.plans[m]);

}
async function linkAndUpload(user) {
  const sets = [];

    const map = col === 'meta' ? { settings: S.settings } : S[col];
    for (const [k, v] of Object.entries(map)) sets.push({ col, id: k, data: v });

function finishLink(user) {

function beginListening() {
  const user = sync.user; if (!user) return;
  canGenerate = false; // wait for the account's data before adding recurring payments
  sync.status = 'connecting'; render();

    if (!sync.user || sync.user.uid !== user.uid) return;
    if (col === 'meta') { if (docs.settings) S.settings = normalizeState({ settings: docs.settings }, { fill: false }).state.settings; }

async function authAction(kind) {

  if (!a.email.trim()) { a.error = 'Enter your email.'; return render(); }
  if (kind !== 'reset' && !a.password) { a.error = 'Enter your password.'; return render(); }

    else if (kind === 'up') await sync.cloud.signUp(a.email.trim(), a.password);

function finishSetup() {

  st.amount = (($('#su-amount') || {}).value) || st.amount;
  const a2 = parseCents(st.amount);
  if (!a2.cents) { st.error = a2.error || 'Enter your monthly allowance.'; return render(); }
  const chosen = st.cats.filter(c => c.on);
  if (!chosen.length) { st.error = 'Keep at least one category.'; return render(); }
  const bad = chosen.find(c => c.limit && parseCents(c.limit).error);
  if (bad) { st.error = `Check the limit for ${bad.name}: ${parseCents(bad.limit).error}`; return render(); }

  chosen.forEach((c, i) => put('categories', { id: uid(), name: c.name, icon: c.icon, color: c.color, order: i, archived: false, rollover: false, rolloverFrom: null,

let toastTimer = null, toastAction = null;
function toast(msg, action) {
  const el = $('#toast');

  el.innerHTML = `<span>${esc(msg)}</span>${action ? `<button data-act="toast-action">${esc(action.label)}</button>` : ''}`;
  el.hidden = false;
  clearTimeout(toastTimer);

});
document.addEventListener('toggle', ev => { if (ev.target.classList && ev.target.classList.contains('calc')) ui.calcOpen = ev.target.open; }, true);
document.addEventListener('submit', ev => { if (ev.target.id === 'auth-form') { ev.preventDefault(); authAction('in'); } });
function onFieldChange(ev) {
  const t = ev.target;
  if (ui.sheet && t.closest('#sheet')) {
    const d = ui.sheet.draft;
    if (t.dataset.field) d[t.dataset.field] = t.type === 'checkbox' ? t.checked : t.value;
    if (t.dataset.part != null) d.parts[Number(t.dataset.part)][t.dataset.pf] = t.value;
    if (ui.sheet.kind === 'entry' && t.dataset.field === 'note' && !d.catTouched && !d.split) {
      const hit = suggestFor(d.note);
      if (hit && hit.categoryId !== d.categoryId) {
        d.categoryId = hit.categoryId;
        $$('#sheet .chip').forEach(b => b.setAttribute('aria-checked', String(b.dataset.id === hit.categoryId)));
      }
      setErr('note-hint', hit ? `Category set to ${catFor(hit.categoryId).name}, like your past "${hit.note}" entries.` : '');
    }
    validateSheet();
    return;
  }
  if (t.dataset.su) { ui.setup[t.dataset.su] = t.value; return; }
  if (t.dataset.suCat != null) {
    const c = ui.setup.cats[Number(t.dataset.suCat)];
    if (t.dataset.suF === 'on') { c.on = t.checked; render(); } else c.limit = t.value;
    return;
  }
  if (t.id === 'trend-cat') { ui.trendCat = t.value; render(); return; }
  if (t.id === 'bva-month') { ui.bvaMonth = t.value; render(); return; }
  if (t.dataset.filter) {
    const key = t.dataset.filter;
    ui.filters[key] = t.value;
    if (key === 'q') { clearTimeout(onFieldChange.timer); onFieldChange.timer = setTimeout(render, 120); return; }
    render();
  }
  if (t.id === 'a-email' && ui.auth) ui.auth.email = t.value;
}
document.addEventListener('input', onFieldChange);
document.addEventListener('change', ev => {
  if (ev.target.id === 'restore-file') { const f = ev.target.files && ev.target.files[0]; if (f) readBackup(f); ev.target.value = ''; return; }
  onFieldChange(ev);
});
document.addEventListener('keydown', ev => {
  if (!ui.sheet) return;
  if (ev.key === 'Escape') { ev.preventDefault(); if (ui.sheet.kind === 'syncchoice') sync.cloud.signOut(); closeSheet(); return; }
  if (ev.key === 'Tab') { // keep keyboard focus inside the open sheet
    const items = $$('#sheet button:not([disabled]), #sheet input:not([type=hidden]), #sheet select, #sheet [tabindex="-1"]').filter(x => x.offsetParent !== null);
    if (!items.length) return;
    const first = items[0], last = items[items.length - 1];
    if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
    else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
  }
  if (ev.key === 'Enter' && ev.target.tagName === 'INPUT' && ev.target.type !== 'checkbox') { ev.preventDefault(); saveSheet(); }
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { calcVersion++; if (postDueRecurring() || !ui.sheet) render(); }
});
window.addEventListener('online', () => { if (sync.user && sync.status === 'offline') { sync.status = 'saving'; scheduleRender(); } });
window.addEventListener('offline', () => { if (sync.user) { sync.status = 'offline'; scheduleRender(); } });

// =====================================================================
// Start
// =====================================================================
postDueRecurring();
render();
startSync();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
